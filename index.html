<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <title>XC Race Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="hdr-title">XC Race Tracker</div>
    <div id="hdr-race"></div>
    <button id="btn-settings" class="icon" aria-label="Settings">⚙</button>
  </header>

  <!-- HOME: pick a mode -->
  <section id="view-home" class="view">
    <p class="hint">Pick your job. Your race and settings are remembered on this phone.</p>
    <button class="mode" data-mode="timer">⏱ Timer<small>Press LAP as each runner crosses the line</small></button>
    <button class="mode" data-mode="finishers">🏃 Finishers<small>Tap each bib number in chute order</small></button>
    <button class="mode" data-mode="results">🏆 Results<small>See merged results and team scores</small></button>
  </section>

  <!-- TIMER -->
  <section id="view-timer" class="view hidden">
    <div id="clock">00:00.0</div>
    <button id="btn-start" class="big start">START RACE</button>
    <button id="btn-lap" class="big lap hidden">LAP<small id="lap-count">0 finishers</small></button>
    <div class="row">
      <button id="btn-timer-undo" class="secondary">Undo last</button>
      <button id="btn-timer-send" class="primary">Send</button>
    </div>
    <ol id="timer-list" class="list" reversed></ol>
    <div class="row">
      <button id="btn-timer-copy" class="secondary small">Copy results</button>
      <button id="btn-timer-reset" class="danger small">Reset race</button>
    </div>
  </section>

  <!-- FINISHERS -->
  <section id="view-finishers" class="view hidden">
    <div class="row">
      <input id="bib-filter" type="tel" inputmode="numeric" placeholder="Type bib digits to filter" autocomplete="off">
      <button id="btn-fin-undo" class="secondary">Undo</button>
    </div>
    <div id="bib-grid" class="grid"></div>
    <div class="row">
      <button id="btn-unknown" class="warn">Runner with no bib</button>
      <button id="btn-fin-send" class="primary">Send</button>
    </div>
    <ol id="fin-list" class="list" reversed></ol>
    <div class="row">
      <button id="btn-fin-copy" class="secondary small">Copy results</button>
      <button id="btn-roster-refresh" class="secondary small">Refresh bibs</button>
      <button id="btn-fin-reset" class="danger small">Reset race</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="view-results" class="view hidden">
    <div class="row">
      <button id="btn-results-refresh" class="primary">Refresh</button>
    </div>
    <div id="results-status" class="hint"></div>
    <div id="results-out"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" class="view hidden">
    <label>Race name<input id="set-race" placeholder="e.g. Girls Varsity"></label>
    <label>Your name<input id="set-device" placeholder="e.g. Sam"></label>
    <label>Sheet endpoint URL<input id="set-endpoint" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label>Bibs for this race (fallback if bibs won't load)<textarea id="set-bibs" rows="3" placeholder="123 456 789"></textarea></label>
    <div class="row">
      <button id="btn-settings-save" class="primary">Save</button>
      <button id="btn-home" class="secondary">Change job</button>
    </div>
    <p class="hint" id="version"></p>
  </section>

  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
